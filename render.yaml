services:
  - type: web
    name: resumematch-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: EMBEDDING_WARMUP_ON_STARTUP
        value: "true"
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: ollama
      - key: OLLAMA_MODE
        value: cloud
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/api
      - key: OLLAMA_MODEL
        value: ministral-3:3b
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      # Set OLLAMA_API_KEY in the Render dashboard. sync: false keeps it
      # out of the repo and out of any future render.yaml sync operations.
      - key: OLLAMA_API_KEY
        sync: false
